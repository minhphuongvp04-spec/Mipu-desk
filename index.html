<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TSMT Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: left folder rail (Outlook-style groups) + one focused page at a time; light canvas, white rounded blocks, Arcadyan green accent, one colour per project */
:root{
  --canvas:#F5F7F6; --card:#FFFFFF; --ink:#18201B; --ink2:#3A433D; --muted:#6A7380; --line:#E6E9E3; --hair:rgba(20,32,22,.07);
  --brand:#34C47C; --brand-deep:#1F9D60; --brand-soft:#E8F8EF; --slate:#7C88A0;
  --bad:#D64545; --bad-soft:#FCE8E8; --warn:#B87406; --warn-soft:#FDF2DD; --ok:#2E8B57; --ok-soft:#E3F3EA; --blue:#2F6FD6; --blue-soft:#E5EEFC;
  --font:"Geist","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; --sh:0 1px 2px rgba(20,32,22,.04),0 4px 16px -8px rgba(20,32,22,.08);
  --r-lg:16px; --r-md:12px; --r-sm:9px;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--canvas)}
body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.55;letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
/* ---------- sidebar ---------- */
.side{background:var(--canvas);padding:22px 14px 18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:11px;padding:0 6px}
.logo .mark{width:36px;height:36px;border-radius:10px;background:var(--brand);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.logo b{font-size:16px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.2} .logo small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-sm);color:var(--ink2);font-weight:500;transition:background .15s,color .15s;width:100%;border:0;background:none;text-align:left}
.ni:hover{background:rgba(20,32,22,.045)}
.ni .lbl{flex:1;min-width:0}
.ni .c{font-size:11.5px;background:rgba(20,32,22,.06);border-radius:8px;padding:0 7px;color:var(--muted);font-variant-numeric:tabular-nums}
.ni .c.bad{background:var(--bad);color:#fff}
.ni .chev{width:15px;height:15px;transition:transform .2s}
.ni.open .chev{transform:rotate(90deg)}
.ni.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
.ni.on svg.i{color:var(--brand-deep)}
.sub{display:flex;flex-direction:column;gap:1px;margin:4px 0 8px 20px;padding-left:12px;border-left:1px solid var(--line)}
.si{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:8px;color:#566059;font-size:13px}
.si:hover{background:rgba(20,32,22,.045);color:var(--ink)}
.si i{width:6px;height:6px;border-radius:50%;flex:none}
.si .c{margin-left:auto;font-size:12px;color:var(--muted)}
.si.on{background:var(--card);font-weight:600;color:var(--ink);box-shadow:var(--sh)}
.sep{font-size:12px;color:var(--muted);padding:10px 10px 2px}
.sideFoot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-md);background:var(--card);box-shadow:var(--sh)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7FDAA9,#1F9D60);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
/* ---------- main ---------- */
.main{padding:22px clamp(16px,3vw,44px) 56px 8px;display:flex;flex-direction:column;gap:22px;min-width:0;max-width:1440px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ham{display:none;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);place-items:center}
.upd{color:var(--muted);font-size:13px}
.langs{margin-left:auto;display:flex;background:rgba(20,32,22,.055);border-radius:10px;padding:3px}
.langs button{border:0;background:none;padding:4px 11px;border-radius:7px;font-size:12.5px;color:var(--muted);font-weight:500}
.langs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,32,22,.1)}
.view{display:flex;flex-direction:column;gap:20px;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h2{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.ph p{color:var(--muted)}
.ph .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.crumb a:hover{color:var(--brand-deep)} .crumb b{color:var(--ink);font-weight:600}
.crumb svg{width:13px;height:13px}
.card{background:var(--card);border-radius:var(--r-lg);padding:22px;border:1px solid var(--hair);box-shadow:var(--sh);min-width:0}
.card h3{font-size:15px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.card h3 .more{margin-left:auto;font-size:13px;color:var(--brand-deep);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.55}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.gray{background:var(--canvas);color:var(--muted)} .chip.blue{background:var(--blue-soft);color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.btn{border-radius:9px;padding:9px 16px;font-weight:600;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--card)}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
.btn svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--brand-deep);outline-offset:2px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 10px;color:var(--muted);text-align:center}
.empty svg{width:120px;height:80px}
/* hero */
.hero{border-radius:20px;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,#E3F7EC 0%,rgba(234,245,222,0) 55%),var(--card);border:1px solid var(--hair);box-shadow:var(--sh);display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:220px}
.hero .txt{padding:32px 34px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.hero h1{font-size:36px;font-weight:600;letter-spacing:-.035em;line-height:1.1}
.hero h1 em{font-style:normal;font-family:"Noto Sans TC",sans-serif;font-weight:500;color:var(--brand-deep);margin-left:10px;letter-spacing:0}
.hero p{color:#4A544F;max-width:58ch}
.stats{display:flex;gap:0;margin-top:10px;flex-wrap:wrap}
.stat{padding:0 26px 0 0;margin-right:26px;border-right:1px solid var(--line);min-width:72px}
.stat:last-child{border-right:0}
.stat b{font-size:30px;font-weight:600;letter-spacing:-.03em;display:block;line-height:1.1} .stat span{font-size:12px;color:var(--muted)}
.hero .art{position:relative;min-height:200px}
.hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;display:block}
.hero .art::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,0) 22%);z-index:1}
.av img{width:100%;height:100%;object-fit:cover;object-position:46% 50%;border-radius:50%;display:block}
/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.proj{background:var(--card);border:1px solid var(--hair);box-shadow:var(--sh);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,border-color .2s}
.proj:hover{border-color:rgba(20,32,22,.16);box-shadow:0 8px 28px -12px rgba(20,32,22,.18)}
.proj .cover{height:120px;display:block;border-bottom:1px solid var(--hair)}
.proj .cover svg{display:block;width:100%;height:100%}
.proj .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px}
.proj .ttl{display:flex;align-items:center;gap:12px}
.proj .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.proj .ic svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2}
.proj .ttl b{font-size:16px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.25} .proj .ttl span{font-size:13px;color:var(--muted)}
.bar{height:4px;background:rgba(20,32,22,.07);border-radius:4px;overflow:hidden} .bar i{display:block;height:100%;border-radius:4px}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
/* rows */
.tabs{display:inline-flex;gap:2px;margin-bottom:10px;flex-wrap:wrap;background:rgba(20,32,22,.055);border-radius:10px;padding:3px}
.tabs button{padding:4px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);border:0;background:none}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,32,22,.1)}
.oi{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:14px;padding:14px 10px;border-top:1px solid var(--line);border-radius:10px;transition:background .15s}
.oi:first-of-type{border-top:0}
.oi:hover{background:var(--canvas)}
.oi .stripe{border-radius:4px}
.oi .t{font-weight:500;font-size:14.5px;display:grid;grid-template-columns:104px minmax(0,1fr);align-items:baseline;gap:10px;letter-spacing:-.01em}
.oi .t .lotb{justify-self:start}
.oi .l{padding-left:114px}
@media (max-width:600px){.oi .t{grid-template-columns:minmax(0,1fr);gap:4px}.oi .l{padding-left:0}}
.lotb{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;letter-spacing:0;font-variant-numeric:tabular-nums;flex:none}
.ititle{display:flex;align-items:center;gap:12px;flex-wrap:wrap} .ititle .lotb{font-size:15px;padding:3px 10px;border-radius:8px}
.oi .l{font-size:13px;color:#59635C;margin-top:4px}
.oi .l .d{color:var(--muted);margin-right:6px}
.oi .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mine{background:linear-gradient(160deg,#EEFAF3,#FFFFFF 70%);border:1px solid #CDEFDC}
.mine h3{color:var(--ink)} .mine .muted{color:var(--muted)}
.ownerTag{font-size:11.5px;background:var(--brand-soft);color:var(--brand-deep);padding:2px 8px;border-radius:999px;margin-left:auto;font-weight:600}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-top:1px solid var(--line);font-size:13.5px;border-radius:8px}
.task:first-of-type{border-top:0}
.task:hover{background:rgba(31,157,96,.06)}
.task .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:#7FDAA9}
.task .dot.bad{background:var(--bad)}.task .dot.warn{background:#E0A21B}
.up{display:flex;flex-direction:column;gap:10px}
.up .day{display:grid;grid-template-columns:46px 1fr;gap:10px}
.up .dd{background:var(--canvas);border-radius:12px;text-align:center;padding:5px 0;line-height:1.15}
.up .dd b{font-size:17px;display:block} .up .dd span{font-size:11px;color:var(--muted)}
.up .dd.today{background:var(--brand-deep);color:#fff} .up .dd.today span{color:#CDEFDC}
.up .ev{font-size:13px;display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0}
.up .ev div{display:flex;gap:7px;align-items:center}
.up .ev i{width:7px;height:7px;border-radius:50%;flex:none}
/* shipments list */
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.destg{border-left:2px solid var(--dc);padding:2px 0 4px 20px;margin-bottom:30px}
.destg h3{display:flex;align-items:center;gap:10px;font-size:16px;margin:0 0 14px;color:var(--dc)}
.destg .dbadge{background:var(--dc);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:7px}
.sc{background:var(--card);border:1px solid var(--hair);box-shadow:var(--sh);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .2s,border-color .2s}
.sc:hover{border-color:rgba(20,32,22,.16);box-shadow:0 8px 28px -12px rgba(20,32,22,.18)}
.sc .top{display:flex;gap:12px;align-items:center}
.thumb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.thumb svg{width:22px;height:22px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sc b{font-size:15px;font-weight:600;letter-spacing:-.015em;display:block;line-height:1.3}
.sc .rt{font-size:12.5px;color:var(--muted)}
.sc .prog{display:flex;flex-direction:column;gap:5px}
.sc .prog .lab{display:flex;justify-content:space-between;font-size:12.5px}
.sc .foot{display:flex;gap:6px;flex-wrap:wrap}
/* detail */
.dhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.dthumb{width:84px;height:84px;border-radius:20px;display:grid;place-items:center}
.dthumb svg{width:38px;height:38px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dhead h2{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.route{display:flex;gap:8px;align-items:center;color:#4A544F;margin-top:4px;flex-wrap:wrap}
.route svg{width:34px;height:10px;flex:none}
.stepper{display:grid;gap:0;overflow-x:auto;padding:4px 2px}
.stp{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12.5px;color:var(--muted);position:relative;min-width:84px}
.stp .dot{width:30px;height:30px;border-radius:50%;background:var(--canvas);border:2px solid var(--line);display:grid;place-items:center;z-index:1;font-weight:700;font-size:12px}
.stp::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line)}
.stp:first-child::before{display:none}
.stp.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done::before{background:var(--brand)}
.stp.cur .dot{background:#fff;border-color:var(--brand-deep);color:var(--brand-deep);box-shadow:0 0 0 5px var(--brand-soft)}
.stp.cur{color:var(--ink);font-weight:700}
.stp small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.fact{background:#F7F8F5;border:1px solid var(--hair);border-radius:var(--r-md);padding:12px 14px;min-width:0}
.fact span{display:block;font-size:12px;color:var(--muted)} .fact b{font-size:14.5px;overflow-wrap:anywhere}
.fact b.late{color:var(--bad)}
.blocker{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border-radius:var(--r-md);padding:12px 14px}
.blocker .ic{width:32px;height:32px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;color:var(--warn)}
.blocker.done{background:var(--canvas)} .blocker.done .ic{color:var(--ok)}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.tli::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.tli:last-child{padding-bottom:0}.tli:last-child::before{display:none}
.tli .dt{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center}
.tli .dt i{width:8px;height:8px;border-radius:50%;background:var(--brand-deep)}
.tli .when{font-size:12px;color:var(--muted)} .tli .what{font-size:13.5px}
.doc{display:flex;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);border-radius:10px}
.doc:first-of-type{border-top:0}
.doc:hover{background:var(--canvas)}
.fi{width:36px;height:42px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:none}
.doc .nm{font-weight:600;font-size:13.5px} .doc .sz{font-size:12px;color:var(--muted)}
.doc .open{margin-left:auto}
.ask{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:12px 14px;color:var(--muted)}
/* production */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{background:var(--card);border:1px solid var(--hair);box-shadow:var(--sh);border-radius:var(--r-lg);padding:16px 18px;display:flex;gap:14px;align-items:center}
.kpi .kic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.kpi .kic svg{width:21px;height:21px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi b{font-size:26px;font-weight:600;letter-spacing:-.03em;display:block;line-height:1.15} .kpi span{font-size:12.5px;color:var(--muted)}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hb .tr{height:10px;background:var(--canvas);border-radius:6px;overflow:hidden} .hb .tr i{display:block;height:100%;border-radius:6px}
.hb .v{text-align:right;font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;display:flex;gap:7px;align-items:center}
.seg button.on{border-color:var(--brand-deep);background:var(--brand-soft);color:var(--brand-deep)}
.seg i{width:8px;height:8px;border-radius:50%}
.stage{display:grid;grid-template-columns:140px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.stage .tr{height:8px;background:var(--canvas);border-radius:6px;overflow:hidden}.stage .tr i{display:block;height:100%;border-radius:6px}
select.sel{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--card)}
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;font-size:12px;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.secrow td{background:var(--canvas);font-weight:700}
tr.hold td{background:var(--warn-soft)}
td.late,.late{color:var(--bad);font-weight:600}
.grid{font-size:12px}
.grid th,.grid td{padding:5px 7px;text-align:right;white-space:nowrap}
.grid th.sl,.grid td.sl{position:sticky;left:0;background:var(--card);text-align:left;z-index:1;min-width:170px}
.grid td.off{background:var(--canvas);color:var(--muted)}
.grid .today{box-shadow:inset 2px 0 0 var(--brand-deep),inset -2px 0 0 var(--brand-deep)}
.grid tr.pl td{color:var(--muted)} .grid td.under{color:var(--bad);font-weight:600} .grid td.over{color:var(--ok);font-weight:600}
.grid .hl{font-size:10px;color:var(--warn);font-weight:600}
.sugg{border-radius:var(--r-md);padding:12px 16px;display:flex;flex-direction:column;gap:5px;background:var(--warn-soft)}
.sugg.ok{background:var(--ok-soft)}
/* calendar */

<script>
(()=>{
const META={"salt":"CixIOfU8Zkioe1mWVxT9NA==","iter":310000,"v":"20261121082549","repo":"minhphuongvp04-spec/Mipu-desk"};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const $=id=>document.getElementById(id);
let K=null;
async function keysFrom(bits){
  const enc=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['encrypt','decrypt']);
  const mac=await crypto.subtle.importKey('raw',bits.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['sign','verify']);
  return {enc,mac};
}
async function derive(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(META.salt),iterations:META.iter,hash:'SHA-256'},k,512));
}
async function dec(buf,k){
  const u=new Uint8Array(buf);if(u.length<64)throw new Error('short');
  const body=u.slice(0,u.length-32),tag=u.slice(u.length-32);
  if(!await crypto.subtle.verify('HMAC',k.mac,tag,body))throw new Error('badkey');
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC',iv:body.slice(0,16)},k.enc,body.slice(16)));
}
async function get(p){const r=await fetch(p+'?v='+META.v,{cache:'no-cache'});if(!r.ok)throw new Error('net');return r.arrayBuffer()}
function forget(){try{sessionStorage.removeItem('tsmt_k');localStorage.removeItem('tsmt_k')}catch(e){}}
const revOf=s=>+((s.match(/"rev":\s*(\d+)/)||[0,0])[1]);
async function encB(plain,k){
  const iv=crypto.getRandomValues(new Uint8Array(16));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-CBC',iv},k.enc,plain));
  const body=new Uint8Array(16+ct.length);body.set(iv);body.set(ct,16);
  const tag=new Uint8Array(await crypto.subtle.sign('HMAC',k.mac,body));
  const out=new Uint8Array(body.length+32);out.set(body);out.set(tag,body.length);return out;
}
const tok=()=>{try{return localStorage.getItem('tsmt_gh')||''}catch(e){return ''}};
async function api(p,o){
  const r=await fetch('https://api.github.com/repos/'+META.repo+p,Object.assign({cache:'no-store'},o||{},{headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}));
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}throw new Error(r.status+(m?' '+m:''))}
  return r.json();
}
window.TSMT_STORE={
  repo:META.repo,
  hasToken:()=>!!tok(),
  clear(){try{localStorage.removeItem('tsmt_gh')}catch(e){}},
  async setToken(v){const old=tok();try{localStorage.setItem('tsmt_gh',v)}catch(e){}try{const j=await api('');if(!j.permissions||!j.permissions.push)throw new Error('no write access');}catch(e){try{if(old)localStorage.setItem('tsmt_gh',old);else localStorage.removeItem('tsmt_gh')}catch(x){}throw e}},
  async save(text,baseRev){
    const cur=await api('/contents/data.enc?ref=main');
    const remote=new TextDecoder().decode(await dec(b64(cur.content.replace(/\s/g,'')).buffer,K));
    if(revOf(remote)>baseRev)throw new Error('conflict');
    const enc=await encB(new TextEncoder().encode(text),K);
    await api('/contents/data.enc',{method:'PUT',body:JSON.stringify({message:'Web edit '+new Date().toISOString().slice(0,16).replace('T',' '),content:tob64(enc),sha:cur.sha,branch:'main'})});
    try{sessionStorage.setItem('tsmt_pending',text)}catch(e){}
  },
  async uploadDoc(path,bytes){
    let sha;try{sha=(await api('/contents/'+encodeURI(path)+'.enc?ref=main')).sha}catch(e){if(!/^404/.test(e.message))throw e}
    const enc=await encB(bytes,K);
    await api('/contents/'+encodeURI(path)+'.enc',{method:'PUT',body:JSON.stringify(Object.assign({message:'Upload '+path.split('/').pop(),content:tob64(enc),branch:'main'},sha?{sha}:{}))});
  }
};
async function getDoc(path){
  try{return await get(path)}catch(e){
    if(!tok())throw e;
    const r=await fetch('https://api.github.com/repos/'+META.repo+'/contents/'+encodeURI(path)+'?ref=main',{cache:'no-store',headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github.raw','X-GitHub-Api-Version':'2022-11-28'}});
    if(!r.ok)throw e;return r.arrayBuffer();
  }
}
async function unlock(bits,remember){
  const k=await keysFrom(bits);
  const data=await dec(await get('data.enc'),k);
  K=k;
  const s=tob64(bits)+'|'+META.salt;
  try{sessionStorage.setItem('tsmt_k',s);if(remember)localStorage.setItem('tsmt_k',s)}catch(e){}
  let text=new TextDecoder().decode(data);
  try{const p=sessionStorage.getItem('tsmt_pending');if(p&&revOf(p)>revOf(text))text=p;else sessionStorage.removeItem('tsmt_pending')}catch(e){}
  (new Function(text))();
  $('gate').remove();
  window.TSMT_APP();
}
function saved(){
  let s=null;try{s=sessionStorage.getItem('tsmt_k')||localStorage.getItem('tsmt_k')}catch(e){}
  if(!s)return null;const p=s.split('|');return p[1]===META.salt?b64(p[0]):null;
}
function showForm(msg){$('gate').style.display='flex';$('gateErr').textContent=msg||'';$('gatePw').focus()}
async function start(){
  if(/[?&]lock=1/.test(location.search)){forget();const q=location.search.replace(/([?&])lock=1(&|$)/,(m,a,b)=>b?a:'').replace(/[?&]$/,'');history.replaceState(null,'',location.pathname+q+location.hash)}
  if(!window.crypto||!crypto.subtle){showForm('This browser cannot open the site. Use Chrome or Edge over https.');return}
  const b=saved();
  if(b){try{await unlock(b,false);return}catch(e){if(e.message==='net'){showForm('Cannot reach the site. Check the connection and reload.');return}forget()}}
  showForm();
  $('gateF').addEventListener('submit',async ev=>{
    ev.preventDefault();const btn=$('gateBtn');btn.disabled=true;$('gateErr').textContent='';
    try{await unlock(await derive($('gatePw').value),$('gateRem').checked)}
    catch(e){btn.disabled=false;$('gatePw').select();$('gateErr').textContent=e.message==='net'?'Cannot reach the site. Check the connection and reload.':'Wrong password. 密码错误。'}
  });
}
document.addEventListener('click',async e=>{
  if(e.target.closest&&e.target.closest('[data-ed]'))return;const a=e.target.closest&&e.target.closest('a.doc');if(!a||!K)return;
  e.preventDefault();
  const href=a.getAttribute('href');
  try{
    const bytes=await dec(await getDoc(href+'.enc'),K);
    const u=URL.createObjectURL(new Blob([bytes]));
    const l=document.createElement('a');l.href=u;l.download=decodeURIComponent(href.split('/').pop());
    document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);
  }catch(err){alert('Could not open this file.')}
},true);
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>

let lang='en';try{lang=localStorage.getItem('tsmt_lang')||'en'}catch(e){}
const t=(k,p)=>{let s=(L[lang]&&L[lang][k])||L.en[k]||k;if(p)for(const x in p)s=s.split('{'+x+'}').join(p[x]);return s};

/* ---------------- owner mode ---------------- */
let OWNER=false;
try{const q=new URLSearchParams(location.search);if(q.has('owner'))localStorage.setItem('tsmt_owner',q.get('owner')==='0'?'0':'1');OWNER=localStorage.getItem('tsmt_owner')==='1'}catch(e){OWNER=/[?&]owner=1/.test(location.search)}

/* ---------------- helpers ---------------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=iso(new Date());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const dow=s=>pd(s).getDay();
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{if(!s)return '—';const d=pd(s);return lang==='en'?MON[d.getMonth()]+' '+d.getDate():lang==='zh'?(d.getMonth()+1)+'/'+d.getDate():d.getDate()+'/'+(d.getMonth()+1)};
const fdw=s=>t('wd'+dow(s))+' '+fd(s);
const num=n=>(n==null||n==='')?'—':Number(n).toLocaleString('en-US');
const pct=(a,b)=>b?a/b*100:0;
const lastLog=o=>(o.log&&o.log.length)?o.log.reduce((m,x)=>x.d>m.d?x:m,o.log[0]):null;
const sortLog=l=>(l||[]).slice().sort((a,b)=>b.d.localeCompare(a.d));
const ic=(id,cls)=>`<svg class="i ${cls||''}"><use href="#${id}"/></svg>`;
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

/* ---------------- projects ---------------- */
const PCOL={dragon:{c:'#1F9D60',soft:'#E8F8EF',g:['#34C47C','#1F9D60'],icon:'i-dragon'},mesh:{c:'#2F6FD6',soft:'#E5EEFC',g:['#5B95EC','#2F6FD6'],icon:'i-mesh'}};
const PROJ=(D.projects||[]).map(p=>Object.assign({},p,PCOL[p.key]||{c:'#7C88A0',soft:'#EEF0F4',g:['#9AA4B8','#7C88A0'],icon:'i-box'}));
const projOf=name=>PROJ.find(p=>name&&name.toLowerCase().includes(p.match.toLowerCase()))||null;
const pchip=name=>{const p=projOf(name);return p?`<span class="chip" style="background:${p.soft};color:${p.c}">${esc(p.name)}</span>`:(name?`<span class="chip gray">${esc(name)}</span>`:'')};
const pcolor=name=>(projOf(name)||{c:'#7C88A0'}).c;

/* ---------------- production plan engine ---------------- */
function genPlan(p,mode){
  const start=p.startDate;let last=start;(p.milestones||[]).forEach(m=>{if(m.d>last)last=m.d});if(TODAY>last)last=TODAY;
  const end=addDays(last,75);const days=[];for(let d=start;d<=end&&days.length<240;d=addDays(d,1))days.push(d);
  const hol=new Set((p.holidays||[]).map(h=>h.d));const wd=new Set(p.workDays||[1,2,3,4,5,6]);const isWork=d=>wd.has(dow(d))&&!hol.has(d);const res={};
  (p.stages||[]).forEach(s=>{const act=(p.actuals||{})[s.key]||{};const pred=s.pred&&res[s.pred];const lag=+s.lag||0;const ramp=s.ramp||[];let cum=0,prod=0;const daily={},cumArr=[];
    days.forEach((d,i)=>{let q=0;if(mode==='forecast'&&d<TODAY){q=+act[d]||0}else if(isWork(d)&&d>=(s.notBefore||start)&&cum<s.target){const rf=prod<ramp.length?ramp[prod]:100;const capQ=Math.round(s.cap*rf/100);let avail=Infinity;if(pred){const j=i-lag;avail=(j>=0?pred.cumArr[j]:0)-cum}q=Math.max(0,Math.min(capQ,s.target-cum,avail))}if(q>0)prod++;cum+=q;daily[d]=q;cumArr.push(cum)});
    const fi=cumArr.findIndex(c=>c>=s.target);res[s.key]={daily,cumArr,finish:fi>=0?days[fi]:null,total:cum}});
  return {days,res,isWork};
}
const actualCum=(p,key,upTo)=>{const a=(p.actuals||{})[key]||{};let c=0;for(const d in a)if(!upTo||d<=upTo)c+=+a[d]||0;return c};
const cumAt=(g,key,d)=>{const r=g.res[key];if(!r)return 0;const i=g.days.indexOf(d);if(i>=0)return r.cumArr[i];return d<g.days[0]?0:r.total};
function expectedCum(p,g,key,d){const a=(p.actuals||{})[key]||{};const lastA=Object.keys(a).filter(x=>x<=d).sort().pop()||'';const tp=(p.tsmtPlan||{})[key];
  if(tp&&Object.keys(tp).length){let c=actualCum(p,key,lastA||'0000');for(const x in tp)if(x>lastA&&x<=d)c+=+tp[x]||0;const st=p.stages.find(s=>s.key===key);return Math.min(c,st?st.target:c)}return cumAt(g,key,d)}
function analysePlan(p){
  const g=genPlan(p,'forecast');const fin=p.finalStage||(p.stages[p.stages.length-1]||{}).key;const fr=g.res[fin];
  const ms=(p.milestones||[]).map(m=>{const c=cumAt(g,fin,m.d);const ri=fr?fr.cumArr.findIndex(x=>x>=m.qty):-1;return Object.assign({},m,{cum:c,short:Math.max(0,m.qty-c),reach:ri>=0?g.days[ri]:null})});
  const gap=ms.find(m=>m.short>0&&m.d>=TODAY);const sugg=[];
  if(gap){let W=0;const M=[];for(let d=TODAY;d<=gap.d;d=addDays(d,1)){if(g.isWork(d))W++;else M.push(d)}let worst=null;
    p.stages.forEach(s=>{const done=cumAt(g,s.key,addDays(TODAY,-1));const need=Math.max(0,Math.min(gap.qty,s.target)-done);if(!need||!W)return;const req=Math.ceil(need/W);if(req>s.cap)sugg.push({type:'cap',st:s.name,a:s.cap,b:req,p:Math.round((req/s.cap-1)*100)});const r=need/s.cap;if(!worst||r>worst.r)worst={r,s,need}});
    if(worst){const extra=Math.ceil(worst.need/worst.s.cap)-W;if(extra>0)sugg.push({type:'days',n:extra,d:gap.d,m:M.map(fd).join(', ')||'—'})}if(gap.reach)sugg.push({type:'delay',d:gap.reach})}
  return {g,fin,ms,gap,sugg};
}

/* ---------------- agenda & events ---------------- */
function nextMeeting(){const md=+((D.settings||{}).meetingDay??4);let d=TODAY;while(dow(d)!==md)d=addDays(d,1);return d}
function agenda(){
  const W=+((D.settings||{}).window||3),stale=+((D.settings||{}).staleDays||3);const out=[];const push=(g,sev,text,sub,href)=>out.push({g,sev,text,sub,href});
  D.shipments.forEach(s=>{if(s.stage>=7)return;const h='#/shipment/'+s.id;
    if(s.etdPlan&&!s.etdActual&&s.stage<4){if(s.etdPlan<TODAY)push('confirm','bad',t('a_etdPassed',{d:fd(s.etdPlan)}),s.title,h);else if(diff(TODAY,s.etdPlan)<=W)push('confirm','warn',t('a_etdSoon',{d:fd(s.etdPlan)}),s.title,h)}
    if(s.etaPlan&&!s.etaActual&&s.stage>=4&&s.stage<5){if(s.etaPlan<TODAY)push('confirm','bad',t('a_etaPassed',{d:fd(s.etaPlan)}),s.title,h);else if(diff(TODAY,s.etaPlan)<=W)push('confirm','warn',t('a_etaSoon',{d:fd(s.etaPlan)}),s.title,h)}
    if(s.category==='material'&&s.readyDate&&s.stage<1){if(s.readyDate<TODAY)push('confirm','bad',t('a_readyPassed',{d:fd(s.readyDate)}),s.title,h);else if(diff(TODAY,s.readyDate)<=W)push('prepare','warn',t('a_readySoon',{d:fd(s.readyDate)}),s.title,h)}
    (s.blockers||[]).filter(b=>!b.done).forEach(b=>push('due','warn',t('a_blocker',{g:t('b_'+b.group),x:b.detail}),s.title,h));
    const ll=lastLog(s);if(ll&&diff(ll.d,TODAY)>stale)push('confirm','info',t('a_stale',{n:diff(ll.d,TODAY)}),s.title,h)});
  D.outbound.forEach(o=>{if(o.stage>=5)return;const h='#/outbound/'+o.id;const nm=o.customer+' · '+o.model+' · '+num(o.qty)+' pcs';
    if(o.shipPlan&&o.stage<4){if(o.shipPlan<TODAY)push('confirm','bad',t('a_obPassed',{d:fd(o.shipPlan)}),nm,h);else if(diff(TODAY,o.shipPlan)<=W)push('confirm','warn',t('a_obSoon',{d:fd(o.shipPlan)}),nm,h)}});
  openIssues().forEach(i=>{const h='#/issue/'+i.id;if(i.dueDate&&i.dueDate<TODAY)push('due','bad',t('a_overdue',{d:fd(i.dueDate)}),iTxt(i),h);else if(i.dueDate&&diff(TODAY,i.dueDate)<=2)push('due','warn',t('a_dueSoon',{d:fd(i.dueDate)}),iTxt(i),h)});
  D.plans.filter(p=>p.active!==false).forEach(p=>{const a=analysePlan(p);if(a.gap)push('prepare','bad',t('a_dprShort',{n:num(a.gap.short),q:num(a.gap.qty),d:fd(a.gap.d)}),p.name,'#/prod/plan');
    const y=addDays(TODAY,-1);if(dow(y)!==0&&!(p.holidays||[]).some(h=>h.d===y)&&!D.qa.some(r=>r.date===y&&r.project===p.project))push('confirm','warn',t('a_qaY',{d:fd(y)}),p.name,'#/prod/qa')});
  const nm=nextMeeting();if(diff(TODAY,nm)<=2){const lastM=addDays(nm,-7);const op=openIssues();push('prepare','info',t('a_meeting',{d:fdw(nm),n:op.length,m:op.filter(i=>{const l=lastLog(i);return !l||l.d<=lastM}).length}),'','#/open')}
  const o={bad:0,warn:1,info:2};return out.sort((a,b)=>o[a.sev]-o[b.sev]);
}
function events(from,to){
  const ev=[];const add=(d,txt,col,href)=>{if(d&&d>=from&&d<=to)ev.push({d,txt,col,href})};
  D.shipments.forEach(s=>{if(s.stage>=7)return;const c=pcolor(s.project),h='#/shipment/'+s.id;if(s.etdPlan&&!s.etdActual)add(s.etdPlan,t('ev_etd')+' · '+s.title,c,h);if(s.etaPlan&&!s.etaActual)add(s.etaPlan,t('ev_eta')+' · '+s.title,c,h);if(s.readyDate&&s.stage<1)add(s.readyDate,t('ev_ready')+' · '+s.title,c,h)});
  D.outbound.forEach(o=>{if(o.stage<4&&o.shipPlan)add(o.shipPlan,t('ev_ship')+' · '+o.customer+' '+num(o.qty),pcolor(o.project),'#/outbound/'+o.id)});
  openIssues().forEach(i=>{if(i.dueDate)add(i.dueDate,t('ev_due')+' · '+iTxt(i),pcolor(i.project),'#/issue/'+i.id)});
  D.plans.forEach(p=>{const c=pcolor(p.project);(p.milestones||[]).forEach(m=>add(m.d,t('ev_ms')+' · '+num(m.qty)+' pcs',c,'#/prod/plan'));(p.events||[]).forEach(e=>add(e.d,e.label,c,'#/prod/plan'));(p.holidays||[]).forEach(h=>add(h.d,t('ev_hol')+' · '+h.label,'#B0B8B2',''))});
  for(let d=from;d<=to;d=addDays(d,7)){let m=d;while(dow(m)!==+((D.settings||{}).meetingDay??4))m=addDays(m,1);add(m,t('ev_meet')+((D.settings||{}).meetingTime?' '+D.settings.meetingTime:''),'#1B2420','#/open')}
  const seen=new Set();return ev.filter(e=>{const k=e.d+e.txt;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.d.localeCompare(b.d));
}

  if(lc){lc.querySelector('h3').insertAdjacentHTML('afterend',`<form class="logf" data-type="${type}" data-id="${it.id}"><input type="date" name="d" value="${TODAY}" aria-label="Date"><input type="text" name="text" placeholder="${esc(t('ed_upd_ph'))}" required><button class="btn pri">${t('ed_add')}</button></form>`);
    const sorted=sortLog(it.log);lc.querySelectorAll('.tli').forEach((el,i)=>{const li=(it.log||[]).indexOf(sorted[i]);el.insertAdjacentHTML('beforeend',`<button class="xdel" title="${esc(t('ed_delete'))}" data-ed="dellog" data-type="${type}" data-id="${it.id}" data-li="${li}">×</button>`)})}
  if(type!=='issue'){const stp=v.querySelectorAll('.stp');stp.forEach((el,i)=>{el.classList.add('edstp');el.dataset.ed='stage';el.dataset.type=type;el.dataset.id=it.id;el.dataset.si=i;el.title=t('ed_step_hint')})}
  if(type==='shipment'){
    v.querySelectorAll('.blocker[data-bi]').forEach(el=>{const bi=+el.dataset.bi;const b=it.blockers[bi];el.insertAdjacentHTML('beforeend',`<div class="bact"><button class="btn sm" data-ed="blk" data-id="${it.id}" data-bi="${bi}">${b.done?t('ed_reopen'):t('ed_resolve')}</button><button class="xdel" data-ed="delblk" data-id="${it.id}" data-bi="${bi}">×</button></div>`)});
    const first=v.querySelector('.cols2 .stack > .card');if(first)first.insertAdjacentHTML('afterend',`<form class="blkf" data-id="${it.id}"><select name="group">${BGROUPS.map(g=>`<option value="${g}">${esc(t('b_'+g))}</option>`).join('')}</select><input type="text" name="detail" placeholder="${esc(t('ed_blk_ph'))}" required><button class="btn">${t('ed_add_blk')}</button></form>`);
  }
}
Object.assign(L.en,{up_doc:'Upload a file',up_doc_txt:'The file is encrypted in your browser before it goes online. Only people with the site password can open it.',up_file:'File',up_cat:'Folder',up_title:'Title',up_date:'Date',up_btn:'Upload',up_busy:'Encrypting and uploading…',up_done:'Uploaded. It can be opened in about 1–2 minutes.',up_err:'Upload failed: {e}',up_big:'This file is over 25 MB. Please send it to Claude instead.',up_local:'Uploading works on the online site after the GitHub token is set (Update data page).',up_del:'Remove this file from Documents?'});
Object.assign(L.vi,{up_doc:'Tải file lên',up_doc_txt:'File được mã hóa ngay trong trình duyệt trước khi đưa lên mạng. Chỉ ai có mật khẩu web mới mở được.',up_file:'File',up_cat:'Thư mục',up_title:'Tên hiển thị',up_date:'Ngày',up_btn:'Tải lên',up_busy:'Đang mã hóa và tải lên…',up_done:'Đã tải lên. Khoảng 1–2 phút nữa là mở được.',up_err:'Tải lên không được: {e}',up_big:'File lớn hơn 25 MB. Bạn gửi cho Claude giúp nhé.',up_local:'Tải file lên dùng được trên web online sau khi đã cài GitHub token (trang Cập nhật dữ liệu).',up_del:'Gỡ file này khỏi mục Tài liệu?'});
const DOCCATS=['minutes','dpr','qareport','po','other'];
const safeName=n=>n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w.\-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
function docUploadCard(cur){
  const ok=window.TSMT_STORE&&TSMT_STORE.hasToken();
  return `<div class="card upcard"><h3>${ic('i-folder')}${t('up_doc')}</h3>${ok?`<form class="upf"><label class="wide">${t('up_file')}<input type="file" name="file" required></label><label>${t('up_cat')}<select name="cat">${DOCCATS.map(c=>`<option value="${c}" ${c===cur?'selected':''}>${esc(t('sub_'+c))}</option>`).join('')}</select></label><label>${t('f_project')}<select name="project"><option value="">—</option>${PROJVALS().map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="wide">${t('up_title')}<input type="text" name="title" placeholder="${esc(t('up_title'))}"></label><label>${t('up_date')}<input type="date" name="date" value="${TODAY}"></label><div class="upact"><button class="btn pri">${t('up_btn')}</button><span class="muted upst"></span></div></form><p class="muted" style="font-size:12.5px;margin-top:10px">${t('up_doc_txt')}</p>`:`<p class="muted">${t('up_local')}</p>`}</div>`;
}
async function uploadDoc(f){
  const st=f.querySelector('.upst');const file=f.file.files[0];if(!file)return;
  if(file.size>25*1024*1024){st.textContent=t('up_big');return}
  const btn=f.querySelector('button');btn.disabled=true;st.textContent=t('up_busy');
  try{
    const date=f.date.value||TODAY;const path='docs/'+date+'_'+safeName(file.name);
    await TSMT_STORE.uploadDoc(path,new Uint8Array(await file.arrayBuffer()));
    D.docs=D.docs||[];const old=D.docs.find(d=>d.file===path);
    const entry={id:'doc-'+Date.now().toString(36),title:f.title.value.trim()||file.name.replace(/\.[^.]+$/,''),cat:f.cat.value,project:f.project.value,date,file:path,size:file.size};
    if(old)Object.assign(old,entry,{id:old.id});else D.docs.push(entry);
    ED.dirty++;D.updated=TODAY;await publish();
    if(!ED.dirty)ED.msg=t('up_done');saveBar();
  }catch(e){st.textContent=t('up_err',{e:e.message});btn.disabled=false}
}
function vSetup(){
  const S_=window.TSMT_STORE;
  const st=!S_?`<div class="muted">${t('ed_local')}</div>`:`<div class="muted" id="tokst">${S_.hasToken()?t('ed_token_ok'):t('ed_token_none')}</div>`;
  return `<div class="card"><h3>${t('ed_setup')}</h3><p style="max-width:70ch;margin-bottom:12px">${t('ed_setup_txt')}</p>${S_?`<form class="tokf"><input type="password" name="tok" autocomplete="off" placeholder="github_pat_…" aria-label="${t('ed_token')}"><button class="btn pri">${t('ed_token_save')}</button>${S_.hasToken()?`<button type="button" class="btn" data-ed="tokrm">${t('ed_token_rm')}</button>`:''}</form>`:''}${st}</div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-ed]');if(!b||!OWNER)return;const a=b.dataset.ed,type=b.dataset.type,id=b.dataset.id;
  if(a==='new')openForm(type,null);
  else if(a==='edit')openForm(type,id);
  else if(a==='close')document.getElementById('edlg').close();
  else if(a==='del'){if(!confirm(t('ed_del_q')))return;const F=FORMS[type];D[F.list]=D[F.list].filter(x=>x.id!==id);document.getElementById('edlg').close();touch();location.hash=type==='issue'?'#/open/all':type==='shipment'?'#/ship/all':'#/out/all'}
  else if(a==='dellog'){if(!confirm(t('ed_del_log')))return;const it=findItem(type,id);it.log.splice(+b.dataset.li,1);touch()}
  else if(a==='stage'){const it=findItem(type,id);const i=+b.dataset.si;it.stage=(it.stage??-1)===i?i-1:i;if(type==='outbound'&&it.stage<0)it.stage=0;touch()}
  else if(a==='blk'){const it=findItem('shipment',id);const bl=it.blockers[+b.dataset.bi];bl.done=!bl.done;touch()}
  else if(a==='delblk'){const it=findItem('shipment',id);it.blockers.splice(+b.dataset.bi,1);touch()}
  else if(a==='publish')publish();
  else if(a==='discard'){ED.dirty=0;location.reload()}
  else if(a==='hidemsg'){ED.msg='';saveBar()}
  else if(a==='tokrm'){TSMT_STORE.clear();render()}
  else if(a==='deldoc'){e.preventDefault();e.stopPropagation();if(!confirm(t('up_del')))return;D.docs=D.docs.filter(d=>d.id!==id);touch()}
});
document.addEventListener('submit',async e=>{
  const f=e.target;if(!OWNER)return;
  if(f.classList.contains('edf')){if(e.submitter&&e.submitter.value!=='ok')return;const miss=[...f.querySelectorAll('[required]')].filter(x=>!x.value.trim());if(miss.length){e.preventDefault();alert(t('ed_req',{f:miss.map(x=>x.closest('label').firstChild.textContent).join(', ')}));return}applyForm(f);return}
  if(f.classList.contains('logf')){e.preventDefault();const it=findItem(f.dataset.type,f.dataset.id);(it.log=it.log||[]).push({d:f.d.value||TODAY,text:f.text.value.trim()});touch();return}
  if(f.classList.contains('blkf')){e.preventDefault();const it=findItem('shipment',f.dataset.id);(it.blockers=it.blockers||[]).push({group:f.group.value,detail:f.detail.value.trim(),done:false,since:TODAY});touch();return}
  if(f.classList.contains('upf')){e.preventDefault();uploadDoc(f);return}
  if(f.classList.contains('tokf')){e.preventDefault();const v=f.tok.value.trim();if(!v)return;const el=document.getElementById('tokst');el.textContent=t('ed_testing');try{await TSMT_STORE.setToken(v);el.textContent=t('ed_token_ok');setTimeout(render,1200)}catch(err){el.textContent=t('ed_token_bad',{e:err.message})}}
});
window.addEventListener('beforeunload',e=>{if(OWNER&&ED.dirty){e.preventDefault();e.returnValue=t('ed_leave')}});

/* ---------------- render ---------------- */
const S={openTab:'all',planId:null,qaId:null,chartStage:null,gridAll:false,showTsmt:false,calMonth:null,month:null};
function render(){
  const r=route();renderSide();
  if((r.v==='me'||r.v==='update')&&!OWNER){location.hash='#/open/all';return}
  const map={open:()=>vOpen(r.a),issue:()=>vIssue(r.a),ship:()=>vShip(r.a),shipment:()=>vShipment(r.a),out:()=>vOut(r.a),outbound:()=>vOutbound(r.a),prod:()=>r.a==='qa'?vProdQA():r.a==='plan'?vProdPlan():vProdOverview(),cal:vCal,docs:()=>vDocs(r.a),report:vReport,me:vMe,update:vUpdate};
  const v=document.getElementById('view');v.innerHTML=(map[r.v]||map.open)();ownerDecorate(r);saveBar();
  v.style.animation='none';void v.offsetWidth;v.style.animation='';
  document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.body.classList.remove('menu');
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-lang],[data-tab],[data-plan],[data-qa],[data-act],[data-cal]');if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('tsmt_lang',lang)}catch(x){}}
  else if(b.dataset.tab)S.openTab=b.dataset.tab;
  else if(b.dataset.plan)S.planId=b.dataset.plan;
  else if(b.dataset.qa)S.qaId=b.dataset.qa;
  else if(b.dataset.act==='gridAll')S.gridAll=!S.gridAll;
  else if(b.dataset.act==='showTsmt')S.showTsmt=!S.showTsmt;
  else if(b.dataset.cal!=null){const c=+b.dataset.cal;if(!c)S.calMonth=TODAY.slice(0,7);else{const [y,m]=(S.calMonth||TODAY.slice(0,7)).split('-').map(Number);const d=new Date(y,m-1+c,1);S.calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1)}}
  render();
});
document.addEventListener('change',e=>{if(e.target.id==='stageSel'){S.chartStage=e.target.value;render()}else if(e.target.id==='monthPick'){S.month=e.target.value;render()}});
document.getElementById('ham').addEventListener('click',()=>document.body.classList.toggle('menu'));
document.getElementById('scrim').addEventListener('click',()=>document.body.classList.remove('menu'));
if(!location.hash)history.replaceState(null,'','#/open/all');
render();
};
if(window.TSMT_DATA)window.TSMT_APP();
